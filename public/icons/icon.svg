<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="SDS-CHEM icon">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#14b8a6"/>
      <stop offset="100%" stop-color="#0d9488"/>
    </linearGradient>
    <linearGradient id="liquidGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fcd34d"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="4"/>
      <feOffset dx="0" dy="4" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.25"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Shield body -->
  <path d="M 256 40 L 452 108 L 452 256 C 452 372 362 452 256 484 C 150 452 60 372 60 256 L 60 108 Z"
        fill="url(#shieldGrad)" stroke="#0f766e" stroke-width="6" stroke-linejoin="round"/>

  <!-- Inner highlight border -->
  <path d="M 256 66 L 426 128 L 426 256 C 426 358 348 426 256 456 C 164 426 86 358 86 256 L 86 128 Z"
        fill="none" stroke="#ffffff" stroke-width="3" opacity="0.28"/>

  <!-- Flask neck cap -->
  <rect x="210" y="116" width="92" height="20" rx="4" fill="#ffffff"/>

  <!-- Flask outline (Erlenmeyer) -->
  <path d="M 224 136 L 288 136 L 288 196 L 348 312 Q 360 338 332 338 L 180 338 Q 152 338 164 312 L 224 196 Z"
        fill="#ffffff" fill-opacity="0.10" stroke="#ffffff" stroke-width="10" stroke-linejoin="round"/>

  <!-- Liquid inside flask -->
  <path d="M 196 268 L 316 268 L 348 312 Q 360 338 332 338 L 180 338 Q 152 338 164 312 Z"
        fill="url(#liquidGrad)"/>

  <!-- Liquid surface line -->
  <path d="M 200 270 Q 256 262 312 270" stroke="#ffffff" stroke-width="3" fill="none" opacity="0.7"/>

  <!-- Bubbles -->
  <circle cx="226" cy="300" r="5" fill="#ffffff" opacity="0.85"/>
  <circle cx="262" cy="316" r="4" fill="#ffffff" opacity="0.85"/>
  <circle cx="296" cy="302" r="3.5" fill="#ffffff" opacity="0.85"/>

  <!-- Measurement tick marks on neck -->
  <line x1="236" y1="160" x2="244" y2="160" stroke="#ffffff" stroke-width="3" opacity="0.7"/>
  <line x1="236" y1="178" x2="244" y2="178" stroke="#ffffff" stroke-width="3" opacity="0.7"/>

  <!-- SDS text -->
  <text x="256" y="410" text-anchor="middle"
        font-family="Arial Black, Arial, Helvetica, sans-serif"
        font-size="78" font-weight="900" fill="#ffffff" letter-spacing="6">SDS</text>
</svg>
